name: Build Application
run-name: Build Application
on:
    push:
        branches:
            - main

jobs:
    build:
        name: Build Application (${{ matrix.label }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-2025-vs2026
                      label: windows
                    - os: ubuntu-24.04
                      label: linux
                    - os: macos-latest
                      label: macos
        runs-on: ${{ matrix.os }}
        env:
            CACHE_BIN: 'true'
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: 'npm'

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      libgtk-3-dev \
                      libayatana-appindicator3-dev \
                      librsvg2-dev

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: ./src-tauri
                  cache-bin: ${{ env.CACHE_BIN }}

            - name: Install dependencies
              run: npm install

            - name: Update Patrons
              run: npm run update-patrons

            - name: Build Application
              run: npm run tauri build

            - name: Ad-hoc code sign
              if: runner.os == 'macOS'
              run: codesign --force --deep --sign - ./src-tauri/target/release/bbb

            - uses: actions/upload-artifact@v7
              with:
                  path: ./src-tauri/target/release/${{ runner.os == 'Windows' && 'bbb.exe' || 'bbb' }}
                  name: bbb-${{ matrix.label }}
